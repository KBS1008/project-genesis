# Project Genesis — minimal CI (typecheck + targeted vitest)
name: CI — typecheck and targeted vitest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_GENESIS_SAVE_PATH: ''
      PROJECT_GENESIS_ACCEPTANCE_S1_TICK_REQUEST_AUDIT: ''
      PROJECT_GENESIS_ACCEPTANCE_S3_PRODUCTION_SIMULATION_ADVANCE_BUDGET: ''
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Monorepo typecheck
        run: pnpm run typecheck

      - name: Targeted vitest (web inspector)
        run: >-
          pnpm exec vitest run
          apps/web/src/presentation/components/world/world-building-inspector-production.test.ts
          apps/web/src/presentation/components/world/world-building-inspector-navigation.test.ts

      - name: Targeted vitest (API simulation guards)
        run: >-
          pnpm exec vitest run
          apps/api/src/game/acceptance-simulation-advance-guard.test.ts
          apps/api/src/game/acceptance-simulation-tick-request-audit.test.ts